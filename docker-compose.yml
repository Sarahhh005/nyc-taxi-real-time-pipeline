services:

  # =========================
  # Kafka
  # =========================
  kafka:
    image: apache/kafka:latest
    container_name: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9094,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9094,EXTERNAL://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1


  # =========================
  # ClickHouse
  # =========================
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse

    ports:
    - "8123:8123"
    - "9000:9000"

    volumes:
    - ./clickhouse/spark-user.xml:/etc/clickhouse-server/users.d/spark-user.xml:ro
    - ./clickhouse/initial.sql:/docker-entrypoint-initdb.d/initial.sql


  # =========================
  # Spark Master
  # =========================
  spark-master:
    image: apache/spark:latest
    container_name: spark-master

    command:
      ["/opt/spark/bin/spark-class",
       "org.apache.spark.deploy.master.Master"]

    ports:
      - "8080:8080"
      - "7077:7077"

    volumes:
      - ./:/opt/workspace


  # =========================
  # Spark Worker
  # =========================
  spark-worker:
    image: apache/spark:latest
    container_name: spark-worker

    command:
      ["/opt/spark/bin/spark-class",
       "org.apache.spark.deploy.worker.Worker",
       "spark://spark-master:7077"]

    environment:
      SPARK_MASTER_URL: spark://spark-master:7077

    depends_on:
      - spark-master

    volumes:
      - ./:/opt/workspace


  # =========================
  # PostgreSQL - Airflow DB
  # =========================
  postgres:
    image: postgres:16
    container_name: airflow-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================
  # Airflow Init
  # =========================
  airflow-init:
    image: apache/airflow:2.10.5

    container_name: airflow-init

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    volumes:
      - ./dags:/opt/airflow/dags

    command:
      - bash
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true


  # =========================
  # Airflow Webserver
  # =========================
  airflow-webserver:
    image: apache/airflow:2.10.5

    container_name: airflow-webserver

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    ports:
      - "8081:8080"

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    volumes:
      - ./dags:/opt/airflow/dags

    command: webserver


  # =========================
  # Airflow Scheduler
  # =========================
  airflow-scheduler:
    image: apache/airflow:2.10.5

    container_name: airflow-scheduler

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    volumes:
      - ./dags:/opt/airflow/dags

    command: scheduler

# =========================
  # Superset
  # =========================
  superset:
    build:
      context: .
      dockerfile: docker/Dockerfile.superset
    image: nyc-taxi-superset:local
    container_name: superset

    ports:
      - "8088:8088"

    environment:
      SUPERSET_SECRET_KEY: "nyc_taxi_local_secret_key"

    depends_on:
      - clickhouse

    command: >
      /bin/sh -c "
      superset db upgrade &&
      superset fab create-admin
      --username admin
      --firstname Admin
      --lastname User
      --email admin@example.com
      --password admin || true;
      superset init;
      superset run -h 0.0.0.0 -p 8088
      "

  # =========================
  # AI Agent (FastAPI + LangChain)
  # =========================
  ai-agent:
    build:
      context: ./ai_agent
      dockerfile: Dockerfile
    image: nyc-taxi-ai-agent:local
    container_name: ai-agent

    ports:
      - "8000:8000"

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-openrouter/free}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: NYC_TAXI
      CLICKHOUSE_USER: spark_user
      CLICKHOUSE_PASSWORD: spark_pass

    depends_on:
      - clickhouse

  # =========================
  # Frontend (React UI)
  # =========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: nyc-taxi-frontend:local
    container_name: frontend

    ports:
      - "3000:3000"

    environment:
      VITE_API_URL: http://localhost:8000

    depends_on:
      - ai-agent

# =========================
# Volumes
# =========================
volumes:
  postgres-db-volume: